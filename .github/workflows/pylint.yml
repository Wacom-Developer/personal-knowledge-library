name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      # --frozen fails on a stale uv.lock rather than quietly resolving something else.
      run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
    - name: Lint with pylint
      run: |
        # --fail-on=E gates on error-level messages regardless of the score: a score
        # threshold alone let real errors (a redefined method, an uncallable object)
        # through because a few errors barely move a 9.9 rating.
        uv run --no-sync pylint --rcfile=.pylintrc $(git ls-files '*.py') --fail-under=9.5 --fail-on=E
