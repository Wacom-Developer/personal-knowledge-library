name: Upload to PIP

# Controls when the action will run.
on:
  # Triggers the workflow when a release is created
  release:
    types: [created]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "upload"
  upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Sets up python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Install dependencies
      - name: "Installs dependencies"
        # --locked asserts uv.lock is in step with pyproject.toml. NOT --frozen, which
        # only skips updating the lock and would let a stale one through.
        # The dev extra is needed for the verification step below.
        run: uv sync --locked --extra dev

      # Build and upload to PyPI
      - name: "Builds the distribution"
        run: uv build

      # The last gate before the artefacts leave the building. Hatchling's default sdist
      # is "every file VCS does not ignore", which in this repository would include
      # pytest.ini and its live credentials; these tests fail if the pin ever regresses.
      - name: "Verifies the distribution"
        run: uv run --no-sync pytest tests/test_packaging_unit.py --no-cov -p no:cacheprovider -q

      - name: "Uploads to PyPI"
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TWINE_TOKEN }}
